name: Compress All Existing Images

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compression tools
        run: sudo apt-get install -y optipng jpegoptim

      - name: Compress PNGs
        run: |
          find . -name "*.png" \
            -not -path "./.github/*" \
            -not -path "./node_modules/*" \
            -exec optipng -o5 -quiet {} \;

      - name: Compress JPGs
        run: |
          find . \( -name "*.jpg" -o -name "*.jpeg" \) \
            -not -path "./.github/*" \
            -not -path "./node_modules/*" \
            -exec jpegoptim --max=82 --strip-all {} \;

      - name: Commit compressed images
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: compress all existing images [skip ci]"
          commit_user_name: Image Compressor Bot
          commit_user_email: bot@boltbet.co.za
